server:
  port: 8080

spring:
  application:
    name: data-lineage-system
  
  datasource:
    url: jdbc:mysql://db:3306/lineage_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# JWT 配置
jwt:
  secret: dataLineageSystemSecretKeyForJWTTokenGeneration2024
  expiration: 86400000  # 24小时（毫秒）

# 日志配置
logging:
  level:
    root: INFO
    com.lineage: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
